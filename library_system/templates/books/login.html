{% extends 'base.html' %}

{% block title %}登录 - 图书借阅管理系统{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle" style="font-size: 4rem; color: var(--secondary-color);"></i>
                        <h3 class="mt-3 fw-bold">用户登录</h3>
                        <p class="text-muted">欢迎回到图书借阅系统</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="请输入用户名">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>登录
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-0">还没有账号？ <a href="{% url 'register' %}" class="text-decoration-none">立即注册</a></p>
                    </div>

                    <!-- 测试账号提示 -->
                    <div class="alert alert-info mt-4 mb-0">
                        <small>
                            <i class="bi bi-info-circle me-1"></i>
                            <strong>测试账号：</strong><br>
                            普通用户：user / user123<br>
                            管理员：admin / admin123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
