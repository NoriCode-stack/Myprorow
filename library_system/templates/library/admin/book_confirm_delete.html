{% extends 'base.html' %}

{% block title %}删除图书 - 图书馆管理系统{% endblock %}

{% block content %}
<div class="container">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'admin_dashboard' %}">管理后台</a></li>
            <li class="breadcrumb-item"><a href="{% url 'admin_books' %}">图书管理</a></li>
            <li class="breadcrumb-item active">删除图书</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>确认删除</h4>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        {% if book.cover_image %}
                            <img src="{{ book.cover_image }}" class="rounded mb-3" 
                                 style="max-width: 150px; max-height: 200px; object-fit: contain;">
                        {% else %}
                            <div class="book-cover-placeholder rounded mx-auto mb-3" 
                                 style="width: 150px; height: 200px; display: flex; align-items: center; justify-content: center;">
                                <i class="bi bi-book text-white" style="font-size: 3rem;"></i>
                            </div>
                        {% endif %}
                        <h5>{{ book.title }}</h5>
                        <p class="text-muted">{{ book.author }}</p>
                    </div>

                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        确定要删除此图书吗？此操作不可恢复！
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger btn-lg flex-fill">
                                <i class="bi bi-trash me-2"></i>确认删除
                            </button>
                            <a href="{% url 'admin_books' %}" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-x-circle me-2"></i>取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
