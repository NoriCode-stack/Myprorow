{% extends 'base.html' %}

{% block title %}{% if book %}编辑图书{% else %}添加图书{% endif %} - 图书借阅管理系统{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-{% if book %}pencil{% else %}plus-lg{% endif %} me-2"></i>
                        {% if book %}编辑图书{% else %}添加新图书{% endif %}
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold">书名 *</label>
                                <input type="text" name="title" class="form-control form-control-lg" value="{{ book.title|default:'' }}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">ISBN</label>
                                <input type="text" name="isbn" class="form-control form-control-lg" value="{{ book.isbn|default:'' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">作者 *</label>
                                <input type="text" name="author" class="form-control" value="{{ book.author|default:'' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">出版社</label>
                                <input type="text" name="publisher" class="form-control" value="{{ book.publisher|default:'' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">分类 *</label>
                                <select name="category" class="form-select" required>
                                    {% for cat in categories %}
                                    <option value="{{ cat }}" {% if book and book.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">出版年份</label>
                                <input type="number" name="publish_year" class="form-control" value="{{ book.publish_year|default:2024 }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">库存数量</label>
                                <input type="number" name="total_stock" class="form-control" value="{{ book.total_stock|default:5 }}">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">图书简介</label>
                                <textarea name="description" class="form-control" rows="4">{{ book.description|default:'' }}</textarea>
                            </div>
                        </div>
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-lg me-2"></i>保存
                            </button>
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-x-lg me-2"></i>取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
