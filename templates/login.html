{% extends 'base.html' %}

{% block title %}登录 - 图书借阅管理系统{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                            <i class="bi bi-person-lock text-primary display-4"></i>
                        </div>
                        <h3 class="fw-bold">用户登录</h3>
                        <p class="text-muted">登录您的账户以使用完整功能</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">用户名</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text" name="username" class="form-control form-control-lg" placeholder="输入用户名" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password" name="password" class="form-control form-control-lg" placeholder="输入密码" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>登录
                            </button>
                        </div>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="text-muted mb-0">还没有账户？
                            <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">立即注册</a>
                        </p>
                    </div>
                    <div class="mt-4 p-3 bg-light rounded">
                        <p class="small text-muted mb-1"><strong>演示账户：</strong></p>
                        <p class="small mb-0">管理员：admin / admin123</p>
                        <p class="small mb-0">普通用户：user / user123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
