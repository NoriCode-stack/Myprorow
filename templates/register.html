{% extends 'base.html' %}

{% block title %}注册 - 图书借阅管理系统{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                            <i class="bi bi-person-plus text-success display-4"></i>
                        </div>
                        <h3 class="fw-bold">用户注册</h3>
                        <p class="text-muted">创建新账户开始使用</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">用户名</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text" name="username" class="form-control form-control-lg" placeholder="设置用户名" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">邮箱</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope text-muted"></i>
                                </span>
                                <input type="email" name="email" class="form-control form-control-lg" placeholder="输入邮箱地址">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password" name="password" class="form-control form-control-lg" placeholder="设置密码" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">确认密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill text-muted"></i>
                                </span>
                                <input type="password" name="password2" class="form-control form-control-lg" placeholder="再次输入密码" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-person-check me-2"></i>注册
                            </button>
                        </div>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="text-muted mb-0">已有账户？
                            <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">立即登录</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
